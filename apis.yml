aid: acrisure
name: Acrisure
description: >-
  Acrisure is a global fintech and insurance brokerage headquartered in Grand Rapids,
  Michigan, founded in 2005 and grown from $38M to roughly $5B in revenue with more than
  19,000 colleagues across 500+ offices in over 20 countries. It sells commercial and
  personal insurance, employee benefits, payroll and HR, reinsurance, surety bonds, trade
  credit, mortgages, managed IT and cybersecurity through a partner-agency model rather
  than a developer platform. Acrisure publishes no developer portal, no API reference and
  no machine-readable specification of any kind, but it does operate an undocumented,
  OAuth-protected Model Context Protocol server at api.acrisure.com/v1/mcp behind
  Microsoft Entra ID — discoverable only from the `mcp_user` scope in its RFC 8414
  authorization-server metadata.
