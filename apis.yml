apis:
- name: Acrisure MCP Server
  description: >-
    Hosted Model Context Protocol server operated by Acrisure at
    https://api.acrisure.com/v1/mcp. Production and live, protected by Microsoft Entra ID
    via an authorization-code + PKCE flow carrying the single application scope
    `api://bc250bc0-7689-4f21-b164-72a6b57c273b/mcp_user`. Undocumented: Acrisure publishes
    no tool list, no schemas and no reference for it, and RFC 9728 protected-resource
    metadata is absent, so the endpoint is only discoverable by probing the API host's
    authorization-server metadata directly.
  humanURL: https://www.acrisure.com/
  baseURL: https://api.acrisure.com/v1/mcp
